[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --html=reports/report.html --self-contained-html
markers =
    chain: tests validating request chaining across multiple endpoints
    happy_path: tests covering normal, successful operational workflows
    negative: tests verifying error handling, edge cases, and authorization boundaries
    smoke: high-priority smoke tests
    regression: comprehensive regression test suite

# Live Logging Configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
